  --color-text-tertiary:var(--_g600);--color-text-on-brand:var(--_g950);

  --color-border-subtle:rgba(255,255,255,0.06);--color-border-default:rgba(255,255,255,0.10);

  --color-surface-brand:var(--_y400);--color-surface-secondary:var(--_n700);
  --color-text-primary:var(--_g950);--color-text-secondary:var(--_g600);
  --color-text-tertiary:var(--_g400);--color-text-on-brand:var(--_g950);
  --color-brand-primary:var(--_y400);--color-brand-hover:var(--_y600);
  --color-brand-secondary:var(--_n700);
  --color-border-subtle:var(--_g100);--color-border-default:var(--_g200);

.theme-brand{

.theme-navy{

/* ── BASE ────────────────────────────────────────────────────────── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{font-size:15px;}
body{
  background:var(--color-surface-page);
  color:var(--color-text-primary);
  font-family:var(--font-body);
  min-height:100vh;
}

/* ── TOP BAR ────────────────────────────────────────────────────── */
.topbar{
  display:flex;align-items:center;gap:12px;
  padding:10px 20px;
  background:var(--color-surface-secondary);
  border-bottom:1px solid var(--color-border-subtle);
}
.topbar-logo{width:36px;height:36px;border-radius:50%;overflow:hidden;flex-shrink:0;}
.topbar-logo img{display:block;width:100%;height:100%;object-fit:cover;}
.topbar-title{
  font-family:var(--font-display);font-weight:800;font-size:18px;
  text-transform:uppercase;letter-spacing:0.04em;
  color:var(--color-text-primary);flex:1;
}
.topbar-sub{font-size:11px;color:var(--color-text-secondary);}
.theme-bar{display:flex;gap:4px;margin-left:auto;}
.theme-bar button{
  padding:5px 10px;border:1px solid var(--color-border-default);
  background:transparent;color:var(--color-text-secondary);
  font-family:var(--font-body);font-size:11px;border-radius:var(--r-sm);
  cursor:pointer;transition:all 0.15s;
}
.theme-bar button:hover{border-color:var(--color-brand-primary);color:var(--color-text-primary);}
.theme-bar button.active{
  background:var(--color-brand-primary);
  color:var(--color-text-on-brand);
  border-color:var(--color-brand-primary);font-weight:600;
}

/* ── LAYOUT ─────────────────────────────────────────────────────── */
.layout{display:flex;min-height:calc(100vh - 57px);}

/* ── SIDEBAR ────────────────────────────────────────────────────── */
.sidebar{
  width:200px;flex-shrink:0;
  background:var(--color-surface-base);
  border-right:1px solid var(--color-border-subtle);
  padding:16px 10px;
  overflow-y:auto;
  position:sticky;top:0;height:calc(100vh - 57px);
}
.sidebar-heading{
  font-family:var(--font-display);font-weight:700;font-size:10px;
  text-transform:uppercase;letter-spacing:0.12em;
  color:var(--color-text-tertiary);padding:0 6px 10px;
}
.day-pill{
  display:block;width:100%;text-align:left;
  padding:8px 10px;border-radius:var(--r-md);
  border:none;background:transparent;
  cursor:pointer;margin-bottom:3px;
  transition:background 0.12s;
}
.day-pill:hover{background:var(--color-surface-elevated);}
.day-pill.active{
  background:var(--color-surface-elevated);
  outline:1px solid var(--color-border-brand);
}
.pill-date{
  display:block;font-family:var(--font-display);font-weight:700;font-size:15px;
  color:var(--color-text-primary);text-transform:uppercase;
}
.pill-counts{
  display:block;font-size:11px;color:var(--color-text-secondary);margin-top:1px;
}
.pill-severe{
  color:var(--color-danger-fg);font-weight:600;
}

/* ── MAIN ────────────────────────────────────────────────────────── */
.main{flex:1;padding:24px 28px;overflow:auto;}

/* ── DAY HEADER ─────────────────────────────────────────────────── */
.day-header{
  display:flex;align-items:baseline;gap:16px;margin-bottom:20px;
}
.day-title{
  font-family:var(--font-display);font-weight:900;font-size:32px;
  text-transform:uppercase;color:var(--color-text-primary);
}
.day-summary{
  font-size:13px;color:var(--color-text-secondary);
}
.day-severe-badge{
  display:inline-flex;align-items:center;gap:5px;
  background:var(--color-danger-bg);color:var(--color-danger-fg);
  border:1px solid var(--color-danger-bd);
  border-radius:var(--r-pill);padding:2px 10px;font-size:12px;font-weight:600;
}

/* ── REP SECTION ────────────────────────────────────────────────── */
.rep-section{margin-bottom:28px;}
.rep-heading{
  display:flex;align-items:center;gap:10px;
  margin-bottom:10px;padding-bottom:6px;
  border-bottom:1px solid var(--color-border-default);
}
.rep-code{
  font-family:var(--font-display);font-weight:900;font-size:22px;
  text-transform:uppercase;color:var(--color-brand-primary);
}
.rep-name{
  font-family:var(--font-display);font-weight:700;font-size:16px;
  text-transform:uppercase;color:var(--color-text-primary);
}
.rep-badge{
  margin-left:auto;font-size:11px;color:var(--color-text-secondary);
}
.rep-badge .sev{color:var(--color-danger-fg);font-weight:600;}

/* ── TABLE ──────────────────────────────────────────────────────── */
.lines-table{
  width:100%;border-collapse:collapse;font-size:13px;
  background:var(--color-surface-base);
  border-radius:var(--r-lg);overflow:hidden;
  box-shadow:var(--shadow-sm);
}
.lines-table th{
  background:var(--color-surface-elevated);
  color:var(--color-text-secondary);
  font-family:var(--font-display);font-weight:700;font-size:11px;
  text-transform:uppercase;letter-spacing:0.08em;
  padding:8px 12px;text-align:left;
  border-bottom:1px solid var(--color-border-default);
}
.lines-table th.num{text-align:right;}
.lines-table td{
  padding:8px 12px;
  border-bottom:1px solid var(--color-border-subtle);
  vertical-align:top;
}
.lines-table td.num{text-align:right;font-variant-numeric:tabular-nums;}
.lines-table tr:last-child td{border-bottom:none;}
.lines-table tr:hover td{background:var(--color-surface-overlay);}

/* Severe row */
.row-severe td{background:var(--color-danger-bg) !important;}
.row-severe td{border-bottom-color:var(--color-danger-bd);}

/* Disc pct cell */
.disc-cell{
  font-weight:700;font-size:14px;
}
.disc-severe{color:var(--color-danger-fg);}
.disc-normal{color:var(--color-warning-fg);}

/* Store / product names */
.store-name{font-weight:500;color:var(--color-text-primary);}
.prod-name{color:var(--color-text-secondary);font-size:12px;margin-top:2px;}
.acctno{font-size:11px;color:var(--color-text-tertiary);}

/* ── EMPTY STATE ─────────────────────────────────────────────────── */
.empty-day{
  text-align:center;padding:60px 20px;
  color:var(--color-text-tertiary);font-size:14px;
}

/* ── GENERATED LINE ─────────────────────────────────────────────── */
.generated-line{
  font-size:11px;color:var(--color-text-tertiary);
  padding:12px 28px;border-top:1px solid var(--color-border-subtle);
}
</style>

const OLY_THEMES=['theme-light','theme-dark','theme-brand','theme-navy'];
function olyTheme(t,btn){
  document.documentElement.classList.remove(...OLY_THEMES);
  document.documentElement.classList.add(t);
  localStorage.setItem('oly-theme',t);
  document.querySelectorAll('.theme-bar button').forEach(b=>b.classList.toggle('active',b===btn));
}
// Re-apply active button on load
(function(){
  const t=document.documentElement.className;
  document.querySelectorAll('.theme-bar button').forEach(b=>{
    b.classList.toggle('active',b.textContent.trim().toLowerCase()===t.replace('theme-',''));
  });

const REP_ORDER = ["AC", "AP", "BV", "NP", "BM"];
const REP_NAMES = {"AC": "Aboo Cassim", "AP": "Amit Patel", "BV": "Bhadresh Vallabh", "NP": "Nikhil Panchal", "BM": "Byron Minnie"};

function fmtR(v){
  return 'R '+v.toLocaleString('en-ZA',{minimumFractionDigits:2,maximumFractionDigits:2});
}

function renderDay(day){
  const main = document.getElementById('main-content');
  const repsData = DATA[day];
  if(!repsData){
    main.innerHTML='<div class="empty-day">No below-RB invoice lines for this day.</div>';
    return;
  }
  const dateObj = new Date(day+'T00:00:00');
  const dayLabel = dateObj.toLocaleDateString('en-ZA',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  const allLines = Object.values(repsData).flatMap(r=>r.lines);
  const nTotal = allLines.length;
  const nSevere = allLines.filter(l=>l.severe).length;

  let html = `<div class="day-header">
    <div class="day-title">${dayLabel}</div>
    <div class="day-summary">${nTotal} line${nTotal!==1?'s':''} below RB</div>
    ${nSevere>0?`<div class="day-severe-badge">&#9888; ${nSevere} severe (&ge;20% below RB)</div>`:''}
  </div>`;

  // Render reps in preferred order
  const repKeys = REP_ORDER.filter(r=>repsData[r]);
  for(const rep of repKeys){
    const rd = repsData[rep];
    html += `<div class="rep-section">
      <div class="rep-heading">
        <span class="rep-code">${rep}</span>
        <span class="rep-name">${rd.name}</span>
        <span class="rep-badge">${rd.n_total} line${rd.n_total!==1?'s':''}${rd.n_severe>0?` &middot; <span class="sev">${rd.n_severe} severe</span>`:''}
        </span>
      </div>
      <table class="lines-table">
        <thead>
          <tr>
            <th>Store</th>
            <th>Product</th>
            <th class="num">Qty</th>
            <th class="num">Invoice Price</th>
            <th class="num">RB Floor</th>
            <th class="num">% Below RB</th>
            <th class="num">Line Value</th>
          </tr>
        </thead>
        <tbody>`;
    for(const l of rd.lines){
      const sevClass = l.severe ? 'row-severe' : '';
      const discClass = l.severe ? 'disc-severe' : 'disc-normal';
      html += `<tr class="${sevClass}">
        <td>
          <div class="store-name">${l.store}</div>
          <div class="acctno">${l.accno}</div>
        </td>
        <td>
          <div class="store-name">${l.prodname}</div>
          <div class="prod-name">${l.prodno}</div>
        </td>
        <td class="num">${l.qty}</td>
        <td class="num">${fmtR(l.invprice)}</td>
        <td class="num">${fmtR(l.rb_price)}</td>
        <td class="num disc-cell ${discClass}">${l.rb_disc_pct.toFixed(1)}%${l.severe?' &#9888;':''}</td>
        <td class="num">${fmtR(l.ivnett)}</td>
      </tr>`;
    }
    html += `</tbody></table></div>`;
  }
  main.innerHTML = html;
}

function selectDay(day, btn){
  document.querySelectorAll('.day-pill').forEach(b=>b.classList.remove('active'));
  if(btn) btn.classList.add('active');
  renderDay(day);
}

// Auto-select first day on load
(function(){
  const first = document.querySelector('.day-pill');
  if(first){
    first.classList.add('active');
    renderDay(first.dataset.day);
  }
})();
